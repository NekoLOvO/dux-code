# qmllint settings for this project. `make qmllint` runs it (and `make check` runs that).
#
# These severities mark what is left in the tree, not a judgement that the checker is wrong. Most of
# the four categories below are real findings whose fix is a wider change than a lint commit; the
# counts and the fix for each are written next to them. `make qmllint-full` ignores this file.
[General]
# MaxWarnings -1 means no cap.
Warnings=warning

[Warnings]
# UnqualifiedAccess (164). Ids of the enclosing component used inside a delegate: a `pragma
# ComponentBehavior: Bound` at the top of the file makes them resolvable, and 12 files still lack it
# (SettingsContent 65, MessageList 28, CompactionDivider 14, SettingsSidebar 13, ChatSidebar 12). It is
# a behaviour change for delegates, so it wants its own pass over the UI. The other 7 are `modelData`
# on a Repeater over a plain JS array, which `required property var modelData` resolves.
UnqualifiedAccess=info
#
# MissingProperty (67). Four unrelated causes: 29 are SettingsData/Paths members read from Theme.qml,
# which reaches them as same-directory components without `import qs.Common` (adding it clears all 29);
# 17 are `loader.item.foo()`, where item is statically QObject until the Loader loads; 8 are members of
# `parent` or an attached type, both typed QQuickItem; 4 reach Quickshell's `screen`, whose qmltypes
# writes the property type as the C++ class name `QuickshellScreenInfo` where a QML type name is
# required, so no member resolves. The rest are the Loader shape again.
MissingProperty=info
#
# ConfusingExpressionStatement (4). A bare `foo;` on its own line, which is QML's way of making a
# binding depend on `foo`.
ConfusingExpressionStatement=info
#
# ImportFailure (20). The "declared singleton" check runs against the file being linted by path, which
# belongs to no module. The generated index does declare them; linting the same files through it turns
# 20 into 3.
ImportFailure=info
