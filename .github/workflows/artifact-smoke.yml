name: Artifact smoke test

# Temporary: proves upload-artifact@v7 and download-artifact@v8 agree with each other before a
# release depends on them. Deleted once it has run.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - name: Make a file shaped like a release archive
        run: |
          mkdir -p dist
          echo "pretend this is dcode-linux-amd64" > dist/dcode-linux-amd64.tar.gz
          ( cd dist && sha256sum dcode-linux-amd64.tar.gz > dcode-linux-amd64.sha256 )

      - uses: actions/upload-artifact@v7
        with:
          name: dcode-linux-amd64
          path: |
            dist/dcode-linux-amd64.tar.gz
            dist/dcode-linux-amd64.sha256
          if-no-files-found: error

  download:
    needs: upload
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Both assets survived the round trip
        run: |
          ls -l dist
          test -f dist/dcode-linux-amd64.tar.gz
          test -f dist/dcode-linux-amd64.sha256
          sha256sum -c dist/dcode-linux-amd64.sha256 --status 2>/dev/null \
            || ( cd dist && sha256sum -c dcode-linux-amd64.sha256 )
